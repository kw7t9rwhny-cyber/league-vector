name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'tests/development-orchestrator-stage3c-ghaw-compile.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage3c-two-worker-proof-v01

      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 \
            --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version

      - name: Compile Stage 3C Research Worker A
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw compile stage3c-research-worker --strict"

      - name: Compile Stage 3C QA Worker B
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw compile stage3c-qa-worker --strict"

      - name: Strict validate Research Worker A
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw validate stage3c-research-worker --strict"

      - name: Strict validate QA Worker B
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw validate stage3c-qa-worker --strict"

      - name: Stage exact generated locks for connector promotion
        shell: bash
        run: |
          mkdir -p stage3c-lock-bootstrap
          cp .github/workflows/stage3c-research-worker.lock.yml stage3c-lock-bootstrap/stage3c-research-worker.lock.yml
          cp .github/workflows/stage3c-qa-worker.lock.yml stage3c-lock-bootstrap/stage3c-qa-worker.lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage3c-lock-bootstrap/
          git commit -m "stage exact gh-aw v0.86.2 locks for promotion"
          git push origin HEAD:agent/stage3c-two-worker-proof-v01

      - name: Upload deterministic compiled locks for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-agentic-compiled-locks
          path: |
            .github/workflows/stage3c-research-worker.lock.yml
            .github/workflows/stage3c-qa-worker.lock.yml
          if-no-files-found: error
          retention-days: 7

# TEMPORARY BOOTSTRAP ONLY. Generated workflow bytes are staged outside .github/workflows because GITHUB_TOKEN cannot update workflow files.
# No OpenAI secret is referenced and no Codex execution occurs.
