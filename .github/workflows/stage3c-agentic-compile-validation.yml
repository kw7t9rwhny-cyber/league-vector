name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'

permissions:
  contents: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version
      - name: Preserve committed hardened locks
        run: |
          cp .github/workflows/stage3c-research-worker.lock.yml "$RUNNER_TEMP/research.lock.yml"
          cp .github/workflows/stage3c-qa-worker.lock.yml "$RUNNER_TEMP/qa.lock.yml"
      - name: Strict validate sources then deterministically compile exact executable locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict
          PIN=6aab9e5b5c91c615506061f09bedd81a23babe3c
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker --strict --action-mode action --actions-repo github/gh-aw-actions --action-tag "$PIN"
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker --strict --action-mode action --actions-repo github/gh-aw-actions --action-tag "$PIN"
      - name: Export exact compiler-generated locks for remediation
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-claim-ambiguity-generated-locks
          path: |
            .github/workflows/stage3c-research-worker.lock.yml
            .github/workflows/stage3c-qa-worker.lock.yml
      - name: Verify byte-identical hardened locks
        run: |
          cmp --silent "$RUNNER_TEMP/research.lock.yml" .github/workflows/stage3c-research-worker.lock.yml
          cmp --silent "$RUNNER_TEMP/qa.lock.yml" .github/workflows/stage3c-qa-worker.lock.yml
          echo 'byte-identical hardened locks: PASS'
      - name: Audit effective generated lock permissions and write handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          research = Path('.github/workflows/stage3c-research-worker.lock.yml').read_text()
          qa = Path('.github/workflows/stage3c-qa-worker.lock.yml').read_text()
          locks = [research, qa]
          forbidden = ['contents: write','pull-requests: write','actions: write','deployments: write','packages: write','administration: write','statuses: write','checks: write']
          def job_block(text, name):
              marker=f'\n  {name}:\n'; start=text.find(marker); assert start>=0, f'missing job {name}'
              rest=text[start+len(marker):]; nxt=re.search(r'\n  [A-Za-z0-9_-]+:\n',rest)
              return rest[:nxt.start()] if nxt else rest
          for text in locks:
              for value in forbidden: assert value not in text, f'forbidden permission {value}'
              agent=job_block(text,'agent')
              assert 'contents: read' in agent and 'issues: read' in agent
              assert ': write' not in agent
              assert 'GITHUB_READ_ONLY' in agent and '"1"' in agent
              safe=job_block(text,'safe_outputs')
              assert 'issues: write' in safe
              assert 'contents: write' not in safe and 'pull-requests: write' not in safe and 'actions: write' not in safe
              m=re.search(r'GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "[^\n]+"',text); assert m
              config=m.group(0)
              for required in ['\\"add_comment\\"','\\"target\\":\\"53\\"','\\"max\\":1','\\"discussions\\":false','\\"report_incomplete\\"']:
                  assert required in config, f'missing {required}'
              assert 'create_report_incomplete_issue' not in config
              for disallowed in ['create_pull_request','add_labels','remove_labels','merge_pull_request','push_to_pull_request_branch','update_release','dispatch_workflow','create_issue']:
                  assert f'\\"{disallowed}\\"' not in config
              assert 'GH_AW_REPORT_INCOMPLETE_CREATE_ISSUE: "false"' in text
              assert 'GH_AW_FAILURE_REPORT_AS_ISSUE: "false"' in text
          research_pre=job_block(research,'pre_activation')
          assert 'issues: write' in research_pre
          assert 'contents: write' not in research_pre and 'pull-requests: write' not in research_pre and 'actions: write' not in research_pre
          for required in ['STAGE3C_RESEARCH_ACTIVATION_CLAIM v0.1','41898282','parseCanonicalClaim','activation_claim_ambiguity:duplicate_marker','activation_claim_ambiguity:malformed_canonical_claim','activation_claim_ambiguity:conflicting_same_activation_metadata','activation_claim_ambiguity:multiple_same_activation_claims','activation_already_claimed','issue_number: 53','createComment']:
              assert required in research_pre, f'research pre-activation missing {required}'
          assert 'cancel-in-progress: false' in research
          qa_pre=job_block(qa,'pre_activation')
          assert 'issues: read' in qa_pre
          assert ': write' not in qa_pre
          print('effective generated lock audit: PASS')
          PY

