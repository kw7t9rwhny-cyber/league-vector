name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'

permissions:
  contents: write

jobs:
  compile-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/stage3c-two-worker-proof-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 \
            --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version

      - name: Compile Stage 3C Research Worker A
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw compile stage3c-research-worker --strict"

      - name: Compile Stage 3C QA Worker B
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/gh-aw compile stage3c-qa-worker --strict"

      - name: Strict validate both Agentic Workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict

      - name: Commit only exact compiler-generated hardened locks
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "agent/stage3c-two-worker-proof-v01"
          changed="$(git status --porcelain -- .github/workflows/stage3c-research-worker.lock.yml .github/workflows/stage3c-qa-worker.lock.yml)"
          if [ -z "$changed" ]; then
            echo "locks_already_exact=true"
            exit 0
          fi
          if git status --porcelain | grep -vE '^ M \.github/workflows/stage3c-(research|qa)-worker\.lock\.yml$'; then
            echo 'Unexpected generated change outside the two lock files' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/stage3c-research-worker.lock.yml .github/workflows/stage3c-qa-worker.lock.yml
          git commit -m 'regenerate Stage 3C hardened locks with gh-aw v0.86.2'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

# TEMPORARY REMEDIATION BOOTSTRAP ONLY.
# Remove this write-capable compiler helper immediately after the exact generated locks are committed.
# It invokes no Codex execution and has no OpenAI secret access.
