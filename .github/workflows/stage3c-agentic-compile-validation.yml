name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'tests/development-orchestrator-stage3c-r2.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'
      - 'docs/development-orchestrator-stage3c-r2-executable-v01.md'
      - 'stage3c-generated-locks/**'

permissions:
  contents: write

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version
      - name: Preserve committed hardened locks
        run: |
          cp .github/workflows/stage3c-research-worker.lock.yml "$RUNNER_TEMP/research.lock.yml"
          cp .github/workflows/stage3c-qa-worker.lock.yml "$RUNNER_TEMP/qa.lock.yml"
      - name: Strict validate sources then deterministically compile exact executable locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict
          PIN=6aab9e5b5c91c615506061f09bedd81a23babe3c
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker --strict --action-mode action --actions-repo github/gh-aw-actions --action-tag "$PIN"
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker --strict --action-mode action --actions-repo github/gh-aw-actions --action-tag "$PIN"
      - name: Commit deterministic QA lock for remediation staging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! cmp --silent "$RUNNER_TEMP/qa.lock.yml" .github/workflows/stage3c-qa-worker.lock.yml; then
            git add .github/workflows/stage3c-qa-worker.lock.yml
            git commit -m 'Regenerate Stage 3C QA lock'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo 'QA lock already byte-identical; no staging commit required'
          fi
      - name: Verify research lock remains byte-identical
        run: |
          cmp --silent "$RUNNER_TEMP/research.lock.yml" .github/workflows/stage3c-research-worker.lock.yml
          echo 'research hardened lock: PASS'
      - name: Audit effective generated lock permissions and write handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          research=Path('.github/workflows/stage3c-research-worker.lock.yml').read_text()
          qa=Path('.github/workflows/stage3c-qa-worker.lock.yml').read_text()
          def job(text,name):
              marker=f'\n  {name}:\n'; i=text.find(marker); assert i>=0, f'missing {name}'
              rest=text[i+len(marker):]; m=re.search(r'\n  [A-Za-z0-9_-]+:\n',rest)
              return rest[:m.start()] if m else rest
          forbidden=['contents: write','pull-requests: write','actions: write','deployments: write','packages: write','administration: write','statuses: write','checks: write']
          for text in [research,qa]:
              for x in forbidden: assert x not in text, x
              agent=job(text,'agent'); assert 'contents: read' in agent and 'issues: read' in agent and 'GITHUB_READ_ONLY' in agent; assert ': write' not in agent
              safe=job(text,'safe_outputs'); assert 'issues: write' in safe; assert 'contents: write' not in safe and 'pull-requests: write' not in safe and 'actions: write' not in safe
          qpre=job(qa,'pre_activation'); assert 'issues: read' in qpre and ': write' not in qpre
          print('effective generated lock audit: PASS')
          PY

# Temporary deterministic compiler lock-staging only. No Codex execution and no OpenAI secret access. Final candidate restores read-only validation workflow.