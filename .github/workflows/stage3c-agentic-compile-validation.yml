name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'

permissions:
  contents: write

jobs:
  compile-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/stage3c-two-worker-proof-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install verified gh-aw v0.86.2 compiler
        run: |
          curl --fail --silent --show-error --location https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
      - name: Validate then generate exact deterministic locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict
          PIN=6aab9e5b5c91c615506061f09bedd81a23babe3c
          COMMON="--strict --action-mode action --actions-repo github/gh-aw-actions --action-tag $PIN"
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker $COMMON
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker $COMMON
      - name: Stage only exact generated locks
        run: |
          set -euo pipefail
          mkdir -p stage3c-lock-bootstrap
          cp .github/workflows/stage3c-research-worker.lock.yml stage3c-lock-bootstrap/stage3c-research-worker.lock.yml
          cp .github/workflows/stage3c-qa-worker.lock.yml stage3c-lock-bootstrap/stage3c-qa-worker.lock.yml
          git restore -- .github/workflows/stage3c-research-worker.lock.yml .github/workflows/stage3c-qa-worker.lock.yml
          rm -f .gitattributes
          rm -rf .github/aw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stage3c-lock-bootstrap/stage3c-research-worker.lock.yml stage3c-lock-bootstrap/stage3c-qa-worker.lock.yml
          git commit -m 'stage deterministic Stage 3C lock blobs'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

