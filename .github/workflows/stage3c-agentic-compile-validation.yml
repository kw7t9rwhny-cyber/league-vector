name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'

permissions:
  contents: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version
      - name: Preserve committed hardened locks
        run: |
          cp .github/workflows/stage3c-research-worker.lock.yml "$RUNNER_TEMP/research.lock.yml"
          cp .github/workflows/stage3c-qa-worker.lock.yml "$RUNNER_TEMP/qa.lock.yml"
      - name: Strict compile and validate both Agentic Workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict
      - name: Verify byte-identical hardened locks
        run: |
          cmp --silent "$RUNNER_TEMP/research.lock.yml" .github/workflows/stage3c-research-worker.lock.yml
          cmp --silent "$RUNNER_TEMP/qa.lock.yml" .github/workflows/stage3c-qa-worker.lock.yml
      - name: Audit effective generated lock permissions and write handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('.github/workflows/stage3c-research-worker.lock.yml'),
              Path('.github/workflows/stage3c-qa-worker.lock.yml'),
          ]
          forbidden = [
              'contents: write', 'pull-requests: write', 'actions: write',
              'deployments: write', 'packages: write', 'administration: write',
              'statuses: write', 'checks: write',
          ]

          def job_block(text, name):
              marker = f'\n  {name}:\n'
              start = text.find(marker)
              assert start >= 0, f'missing job {name}'
              rest = text[start + len(marker):]
              nxt = re.search(r'\n  [A-Za-z0-9_-]+:\n', rest)
              return rest[:nxt.start()] if nxt else rest

          for path in paths:
              text = path.read_text()
              for value in forbidden:
                  assert value not in text, f'{path}: forbidden permission {value}'

              agent = job_block(text, 'agent')
              assert 'contents: read' in agent and 'issues: read' in agent, f'{path}: agent read permissions missing'
              assert ': write' not in agent, f'{path}: model-facing agent has write permission'
              assert 'GITHUB_READ_ONLY' in agent and '"1"' in agent, f'{path}: GitHub MCP is not read-only'

              safe = job_block(text, 'safe_outputs')
              assert 'issues: write' in safe, f'{path}: safe output handler lacks intended issue-comment permission'
              assert 'contents: write' not in safe and 'pull-requests: write' not in safe and 'actions: write' not in safe

              config_match = re.search(r'GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "[^\n]+"', text)
              assert config_match, f'{path}: missing safe-output handler config'
              config = config_match.group(0)
              assert '\\"add_comment\\"' in config
              assert '\\"target\\":\\"53\\"' in config
              assert '\\"max\\":1' in config
              assert '\\"issues\\":true' in config
              assert '\\"pull_requests\\":false' in config
              assert '\\"discussions\\":false' in config
              for disallowed in [
                  'create_pull_request', 'add_labels', 'remove_labels',
                  'merge_pull_request', 'push_to_pull_request_branch',
                  'update_release', 'dispatch_workflow', 'create_issue',
              ]:
                  assert f'\\"{disallowed}\\"' not in config, f'{path}: disallowed safe output {disallowed}'

          print('effective generated lock audit: PASS')
          PY

# Read-only static validation only. No Codex execution and no OpenAI secret access.
