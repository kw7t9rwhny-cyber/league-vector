name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'
      - 'tests/development-orchestrator-stage3c-agentic.test.js'
      - 'docs/development-orchestrator-stage3c-two-worker-proof-v01.md'

permissions:
  contents: write

jobs:
  compile-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/stage3c-two-worker-proof-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 \
            --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version

      - name: Compile and strict validate both Agentic Workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict

      - name: Stage exact generated lock blobs outside .github/workflows
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "agent/stage3c-two-worker-proof-v01"
          mkdir -p stage3c-lock-bootstrap
          cp .github/workflows/stage3c-research-worker.lock.yml stage3c-lock-bootstrap/stage3c-research-worker.lock.yml
          cp .github/workflows/stage3c-qa-worker.lock.yml stage3c-lock-bootstrap/stage3c-qa-worker.lock.yml
          git restore -- .github/workflows/stage3c-research-worker.lock.yml .github/workflows/stage3c-qa-worker.lock.yml
          rm -f .gitattributes
          unexpected="$(git status --porcelain | grep -vE '^\?\? stage3c-lock-bootstrap/$' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo 'Unexpected bootstrap change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stage3c-lock-bootstrap/stage3c-research-worker.lock.yml stage3c-lock-bootstrap/stage3c-qa-worker.lock.yml
          git commit -m 'stage exact generated Stage 3C lock blobs'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

# TEMPORARY REMEDIATION BOOTSTRAP ONLY.
# The staged blobs are promoted to the executable workflow paths by the GitHub connector,
# then this helper and the staging directory are removed before the final candidate.
# No Codex execution or OpenAI secret access occurs here.
