name: Stage 3C Agentic Workflow Compile Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stage3c-research-worker.md'
      - '.github/workflows/stage3c-research-worker.lock.yml'
      - '.github/workflows/stage3c-qa-worker.md'
      - '.github/workflows/stage3c-qa-worker.lock.yml'
      - '.github/workflows/stage3c-agentic-compile-validation.yml'

permissions:
  contents: write

jobs:
  compile-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/stage3c-two-worker-proof-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install verified gh-aw v0.86.2 compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 --output "$RUNNER_TEMP/gh-aw"
          echo "b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e  $RUNNER_TEMP/gh-aw" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version
      - name: Generate authoritative action pin cache then compile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/gh-aw" update-actions
          test -f .github/aw/actions-lock.json
          "$RUNNER_TEMP/gh-aw" compile stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" compile stage3c-qa-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-research-worker --strict
          "$RUNNER_TEMP/gh-aw" validate stage3c-qa-worker --strict
      - name: Commit only generated pin cache and hardened locks
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "agent/stage3c-two-worker-proof-v01"
          rm -f .gitattributes
          rm -f .github/aw/compat.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/aw/actions-lock.json .github/workflows/stage3c-research-worker.lock.yml .github/workflows/stage3c-qa-worker.lock.yml
          unexpected="$(git diff --cached --name-only | grep -vE '^(\.github/aw/actions-lock\.json|\.github/workflows/stage3c-(research|qa)-worker\.lock\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'pin deterministic Stage 3C gh-aw action resolution'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

# TEMPORARY deterministic pin-cache bootstrap only. Remove before final candidate.
# No Codex execution or OpenAI secret access occurs here.
