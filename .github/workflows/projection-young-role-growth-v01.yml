name: Projection Young Role Growth v0.1
on:
  push:
    branches: [codex/projection-young-role-growth-v01]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  young:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact validated v0.4 frozen control artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lv-control
          curl -L --fail-with-body -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9205731274/zip -o /tmp/lv-control/control.zip
          unzip -q /tmp/lv-control/control.zip -d /tmp/lv-control/unpacked
          mkdir -p .cache/lv-young-v01 data/reports/projection-young-role-growth-v01/control
          cp -R /tmp/lv-control/unpacked/.cache/lv-v04-canonical/. .cache/lv-young-v01/
          cp /tmp/lv-control/unpacked/data/reports/projection-v04-canonical/snapshot-manifest.json .cache/lv-young-v01/snapshot-manifest.json
          cp /tmp/lv-control/unpacked/data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json data/reports/projection-young-role-growth-v01/control/candidate-player-seasons.json
      - name: Verify frozen input snapshot
        run: python -c "import json; m=json.load(open('.cache/lv-young-v01/snapshot-manifest.json')); assert m['snapshot_sha256']=='d261bfb0f64f60f01db7e85cffe36b4025bf5a2958e9ef940968cbd2115c6188'"
      - name: Install pinned research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Run point-model benchmark twice
        run: |
          python scripts/projection-young-role-growth-v01-fixed.py .cache/lv-young-v01 data/reports/projection-young-role-growth-v01/control/candidate-player-seasons.json data/reports/projection-young-role-growth-v01/run-a.json
          python scripts/projection-young-role-growth-v01-fixed.py .cache/lv-young-v01 data/reports/projection-young-role-growth-v01/control/candidate-player-seasons.json data/reports/projection-young-role-growth-v01/run-b.json
          cmp data/reports/projection-young-role-growth-v01/run-a.json data/reports/projection-young-role-growth-v01/run-b.json
          sha256sum data/reports/projection-young-role-growth-v01/run-a.json > data/reports/projection-young-role-growth-v01/result.sha256
      - name: Run two-stage role benchmark twice
        run: |
          python scripts/projection-young-two-stage-v01.py .cache/lv-young-v01 data/reports/projection-young-role-growth-v01/control/candidate-player-seasons.json data/reports/projection-young-role-growth-v01/two-stage-a.json
          python scripts/projection-young-two-stage-v01.py .cache/lv-young-v01 data/reports/projection-young-role-growth-v01/control/candidate-player-seasons.json data/reports/projection-young-role-growth-v01/two-stage-b.json
          cmp data/reports/projection-young-role-growth-v01/two-stage-a.json data/reports/projection-young-role-growth-v01/two-stage-b.json
          sha256sum data/reports/projection-young-role-growth-v01/two-stage-a.json > data/reports/projection-young-role-growth-v01/two-stage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-young-role-growth-v01
          path: data/reports/projection-young-role-growth-v01/
          retention-days: 30
