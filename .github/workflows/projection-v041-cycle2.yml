name: Projection v0.4 Cycle2 Research

on:
  pull_request:
    paths:
      - 'scripts/projection-v041-cycle2.js'
      - 'scripts/projection-v041-cycle2-deep.js'
      - 'scripts/projection-v041-te-root-cause.js'
      - 'scripts/projection-v041-te-huber.js'
      - 'scripts/projection-v041-te-target-robust.js'
      - 'scripts/projection-v041-rookie-canonical.js'
      - '.github/workflows/projection-v041-cycle2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Freeze and verify canonical input snapshot
        run: |
          node scripts/projection-v04-freeze-inputs.js .cache/lv-v041-cycle2
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('.cache/lv-v041-cycle2/snapshot-manifest.json','utf8'));
          const expected='d261bfb0f64f60f01db7e85cffe36b4025bf5a2958e9ef940968cbd2115c6188';
          if(m.snapshot_sha256!==expected) throw new Error(`validated control snapshot drift: ${m.snapshot_sha256}`);
          console.log('control snapshot verified',m.snapshot_sha256);
          NODE
      - name: Reproduce validated v0.4 control on frozen snapshot
        run: node scripts/projection-v04-canonical.js data/reports/projection-v041-cycle2/control .cache/lv-v041-cycle2
      - name: Cycle2 run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-cycle2.js data/reports/projection-v041-cycle2/run-a .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: Cycle2 run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-cycle2.js data/reports/projection-v041-cycle2/run-b .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: Deep diagnostics run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-cycle2-deep.js data/reports/projection-v041-cycle2/deep-a .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json data/reports/projection-v041-cycle2/control/baseline-player-seasons.json
      - name: Deep diagnostics run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-cycle2-deep.js data/reports/projection-v041-cycle2/deep-b .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json data/reports/projection-v041-cycle2/control/baseline-player-seasons.json
      - name: TE root-cause run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-root-cause.js data/reports/projection-v041-cycle2/te-a .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: TE root-cause run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-root-cause.js data/reports/projection-v041-cycle2/te-b .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: TE robust-loss run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-huber.js data/reports/projection-v041-cycle2/huber-a .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: TE robust-loss run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-huber.js data/reports/projection-v041-cycle2/huber-b .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: TE target-robust stat-line run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-target-robust.js data/reports/projection-v041-cycle2/target-robust-a .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: TE target-robust stat-line run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-te-target-robust.js data/reports/projection-v041-cycle2/target-robust-b .cache/lv-v041-cycle2 data/reports/projection-v041-cycle2/control/candidate-player-seasons.json
      - name: Rookie canonical run A
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-rookie-canonical.js data/reports/projection-v041-cycle2/rookie-a .cache/lv-v041-cycle2
      - name: Rookie canonical run B
        run: node -r ./scripts/preload-v03-complete.js scripts/projection-v041-rookie-canonical.js data/reports/projection-v041-cycle2/rookie-b .cache/lv-v041-cycle2
      - name: Prove deterministic cycle2 research
        run: |
          cmp data/reports/projection-v041-cycle2/run-a/cycle2-summary.json data/reports/projection-v041-cycle2/run-b/cycle2-summary.json
          cmp data/reports/projection-v041-cycle2/run-a/cycle2-summary.sha256 data/reports/projection-v041-cycle2/run-b/cycle2-summary.sha256
          cmp data/reports/projection-v041-cycle2/deep-a/deep-summary.json data/reports/projection-v041-cycle2/deep-b/deep-summary.json
          cmp data/reports/projection-v041-cycle2/deep-a/deep-summary.sha256 data/reports/projection-v041-cycle2/deep-b/deep-summary.sha256
          cmp data/reports/projection-v041-cycle2/te-a/te-root-cause.json data/reports/projection-v041-cycle2/te-b/te-root-cause.json
          cmp data/reports/projection-v041-cycle2/te-a/te-root-cause.sha256 data/reports/projection-v041-cycle2/te-b/te-root-cause.sha256
          cmp data/reports/projection-v041-cycle2/huber-a/te-huber.json data/reports/projection-v041-cycle2/huber-b/te-huber.json
          cmp data/reports/projection-v041-cycle2/huber-a/te-huber.sha256 data/reports/projection-v041-cycle2/huber-b/te-huber.sha256
          cmp data/reports/projection-v041-cycle2/target-robust-a/te-target-robust.json data/reports/projection-v041-cycle2/target-robust-b/te-target-robust.json
          cmp data/reports/projection-v041-cycle2/target-robust-a/te-target-robust.sha256 data/reports/projection-v041-cycle2/target-robust-b/te-target-robust.sha256
          cmp data/reports/projection-v041-cycle2/rookie-a/rookie-canonical.json data/reports/projection-v041-cycle2/rookie-b/rookie-canonical.json
          cmp data/reports/projection-v041-cycle2/rookie-a/rookie-canonical.sha256 data/reports/projection-v041-cycle2/rookie-b/rookie-canonical.sha256
          cp .cache/lv-v041-cycle2/snapshot-manifest.json data/reports/projection-v041-cycle2/snapshot-manifest.json
          printf '{"deterministic":true,"comparison":"run-a byte-identical to run-b for complete-stat-line primary, deep, TE root-cause, TE robust-loss, TE target-robust stat-line, and rookie canonical evidence","control_snapshot":"d261bfb0f64f60f01db7e85cffe36b4025bf5a2958e9ef940968cbd2115c6188"}\n' > data/reports/projection-v041-cycle2/determinism-proof.json
      - name: Upload cycle2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v041-cycle2
          path: |
            data/reports/projection-v041-cycle2/
          if-no-files-found: error
          retention-days: 30
