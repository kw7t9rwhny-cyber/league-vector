name: Apply League Vector Premium V2

on:
  push:
    branches: [codex/premium-homepage-shell-v1]
    paths:
      - ".github/workflows/apply-premium-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/premium-homepage-shell-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decode and apply reviewed V2 payload
        run: |
          cat .lv-v2-payload/part-* | base64 --decode > /tmp/league-vector-v2.zip
          unzip -o /tmp/league-vector-v2.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import shutil

          base_css = Path("premium-homepage-base.css")
          css = base_css.read_text()
          artwork = Path("assets/league-vector-runner.webp")
          if not artwork.is_file():
              raise SystemExit("Expected cinematic hero artwork is missing")
          encoded = base64.b64encode(artwork.read_bytes()).decode("ascii")
          old_art = 'url("assets/league-vector-runner.webp?v=0.2")'
          if old_art not in css:
              raise SystemExit("Expected cinematic hero artwork reference is missing")
          css = css.replace(old_art, f'url("data:image/webp;base64,{encoded}")', 1)
          base_css.write_text(css)
          shutil.rmtree("assets")

          index = Path("index.html")
          html = index.read_text()
          for name in (
              "premium-homepage.css",
              "premium-shell-hero.js",
              "premium-shell-sections.js",
              "premium-shell.js",
              "premium-homepage.js",
          ):
              old = f"{name}?v=0.2"
              new = f"{name}?v=0.1.2"
              if old not in html:
                  raise SystemExit(f"Expected V2 cache key missing: {old}")
              html = html.replace(old, new, 1)
          index.write_text(html)

          test = Path("tests/premium-homepage-assets.test.js")
          source = test.read_text()
          old_checks = '''  assert.match(styles, /assets\\/league-vector-runner\\.webp\\?v=0\\.2/);\n  assert.equal(fs.existsSync("assets/league-vector-runner.webp"), true, "Missing local hero artwork");'''
          new_checks = '''  assert.match(styles, /data:image\\/webp;base64,/);\n  assert.doesNotMatch(styles, /assets\\/league-vector-runner\\.webp/);'''
          if old_checks not in source:
              raise SystemExit("Expected hero-art test block is missing")
          source = source.replace(old_checks, new_checks, 1)
          source = source.replace("?v=0\\.2/", "?v=0\\.1\\.2/")
          test.write_text(source)
          PY
      - name: Validate before committing
        run: |
          node --check premium-shell-hero.js
          node --check premium-shell-sections.js
          node --check premium-shell.js
          node --check premium-homepage.js
          node --test tests/premium-homepage-assets.test.js
          npm run validate
      - name: Commit the final V2 implementation
        run: |
          rm -rf .lv-v2-payload
          git config user.name "league-vector-implementation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement cinematic premium homepage v2"
          git push origin HEAD:codex/premium-homepage-shell-v1
