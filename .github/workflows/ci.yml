name: Validate League Vector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  historical-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest 2022-2024 nflverse and current Sleeper identity data
        run: npm run ingest:nflverse -- --seasons 2022,2023,2024 --outputDir data/reports --refresh true
      - name: Upload historical audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-historical-audit
          path: data/reports/
          if-no-files-found: error
          retention-days: 14

  projection-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve benchmark v0.1
        run: npm run benchmark:projections -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024 --folds 2020,2021,2022,2023,2024 --outputDir data/reports/projection-benchmark-v01 --refresh true
      - name: Preserve benchmark v0.2
        run: npm run benchmark:projections:v02 -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024 --folds 2020,2021,2022,2023,2024 --outputDir data/reports/projection-benchmark-v02 --refresh true
      - name: Upload projection benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-benchmark-v02
          path: data/reports/projection-benchmark-v0*/
          if-no-files-found: error
          retention-days: 14

  projection-v03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build v0.3 benchmark and experimental 2026 projections
        run: npm run projection:v03 -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025 --folds 2020,2021,2022,2023,2024,2025 --outputDir data/reports/projection-v03 --refresh true
      - name: Build compact browser projection asset
        run: npm run build:projection-frontend -- --input data/reports/projection-v03/2026-projections.json --output data/experimental/2026-projections.json
      - name: Assemble static experimental preview
        run: |
          mkdir -p site-preview/data/experimental
          cp index.html styles.css experimental.css core-v08.js live-test-fixes-v01.js data-sources-v08.js app.js projection-frontend-v03.js projection-frontend-v03-contract.js experimental-ui-v03.js experimental-ui-v03-enhancements.js site-preview/
          cp data/experimental/2026-projections.json site-preview/data/experimental/
      - name: Verify deployable projection asset resolves and parses
        run: |
          test -s site-preview/data/experimental/2026-projections.json
          node -e "const fs=require('fs');const p='site-preview/data/experimental/2026-projections.json';const a=JSON.parse(fs.readFileSync(p,'utf8'));if(!Array.isArray(a.r)||!a.r.length)throw new Error('Projection asset has no compact records');if(a.m!=='lv-projection-system-v0.3')throw new Error('Unexpected projection model version: '+a.m);"
          python3 -m http.server 4174 --directory site-preview >/tmp/league-vector-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4174/data/experimental/2026-projections.json >/dev/null
      - name: Upload projection v0.3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v03
          path: data/reports/projection-v03/
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental site preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-experimental-site-preview
          path: site-preview/
          if-no-files-found: error
          retention-days: 14

  publish-live-projection-asset:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, historical-data-audit, projection-benchmark, projection-v03]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download green static preview
        uses: actions/download-artifact@v4
        with:
          name: league-vector-experimental-site-preview
          path: generated-preview
      - name: Publish generated projection asset into GitHub Pages source
        run: |
          mkdir -p data/experimental
          cp generated-preview/data/experimental/2026-projections.json data/experimental/2026-projections.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/experimental/2026-projections.json
          if git diff --cached --quiet; then
            echo "Projection asset already matches the green build."
            exit 0
          fi
          git commit -m "chore: publish experimental projection asset [skip ci]"
          git push origin HEAD:main
