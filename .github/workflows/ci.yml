name: Validate League Vector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  historical-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest 2022-2024 nflverse and current Sleeper identity data
        run: npm run ingest:nflverse -- --seasons 2022,2023,2024 --outputDir data/reports --refresh true
      - name: Upload historical audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-historical-audit
          path: data/reports/
          if-no-files-found: error
          retention-days: 14

  projection-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve benchmark v0.1
        run: npm run benchmark:projections -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024 --folds 2020,2021,2022,2023,2024 --outputDir data/reports/projection-benchmark-v01 --refresh true
      - name: Preserve benchmark v0.2
        run: npm run benchmark:projections:v02 -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024 --folds 2020,2021,2022,2023,2024 --outputDir data/reports/projection-benchmark-v02 --refresh true
      - name: Upload projection benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-benchmark-v02
          path: data/reports/projection-benchmark-v0*/
          if-no-files-found: error
          retention-days: 14

  projection-v03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build v0.3 benchmark and experimental 2026 projections
        run: npm run projection:v03 -- --seasons 2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025 --folds 2020,2021,2022,2023,2024,2025 --outputDir data/reports/projection-v03 --refresh true
      - name: Build compact browser projection asset
        run: npm run build:projection-frontend -- --input data/reports/projection-v03/2026-projections.json --output data/experimental/2026-projections.json
      - name: Assemble static experimental preview
        run: |
          mkdir -p site-preview/data/experimental
          cp index.html styles.css experimental.css core-v08.js data-sources-v08.js app.js projection-frontend-v03.js projection-frontend-v03-contract.js experimental-ui-v03.js experimental-ui-v03-enhancements.js site-preview/
          cp data/experimental/2026-projections.json site-preview/data/experimental/
      - name: Upload projection v0.3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v03
          path: data/reports/projection-v03/
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental site preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-experimental-site-preview
          path: site-preview/
          if-no-files-found: error
          retention-days: 14
