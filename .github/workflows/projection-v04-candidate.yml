name: Projection v0.4 Candidate Research

on:
  pull_request:
    paths:
      - 'scripts/projection-v04-candidate.js'
      - '.github/workflows/projection-v04-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run simplified v0.4 candidate benchmark
        run: node scripts/projection-v04-candidate.js data/reports/projection-v04-candidate
      - name: Upload v0.4 candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v04-candidate
          path: data/reports/projection-v04-candidate/
          if-no-files-found: error
          retention-days: 14
