name: Rookie Year-2 Bridge v0.1 Research

on:
  push:
    branches: [codex/rookie-year2-bridge-v01]
    paths:
      - 'scripts/projection-rookie-year2-v01.py'
      - 'docs/projection-rookie-year2-v01.md'
      - '.github/workflows/projection-rookie-year2-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  year2-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated frozen v0.4 control artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lv-control
          curl -L --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9205731274/zip \
            -o /tmp/lv-control/control.zip
          unzip -q /tmp/lv-control/control.zip -d /tmp/lv-control/unpacked
          mkdir -p .cache/lv-rookie-year2-v01 data/reports/projection-v04-canonical/run-a data/reports/projection-rookie-year2-v01
          cp -R /tmp/lv-control/unpacked/.cache/lv-v04-canonical/. .cache/lv-rookie-year2-v01/
          cp /tmp/lv-control/unpacked/data/reports/projection-v04-canonical/snapshot-manifest.json .cache/lv-rookie-year2-v01/snapshot-manifest.json
          cp /tmp/lv-control/unpacked/data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json
      - name: Verify frozen provenance and immutable v0.4 comparator
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('.cache/lv-rookie-year2-v01/snapshot-manifest.json').read_text())
          assert m['snapshot_sha256']=='d261bfb0f64f60f01db7e85cffe36b4025bf5a2958e9ef940968cbd2115c6188',m['snapshot_sha256']
          p=pathlib.Path('data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9e329e7901ecb8e925d5f5aae695dadc30195b33e67f3943177dc13087b45ab0'
          print('validated frozen inputs and v0.4 comparator')
          PY
      - name: Install pinned research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Run bridge twice and prove determinism
        run: |
          python scripts/projection-rookie-year2-v01.py .cache/lv-rookie-year2-v01 data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json data/reports/projection-rookie-year2-v01/run-a.json
          python scripts/projection-rookie-year2-v01.py .cache/lv-rookie-year2-v01 data/reports/projection-v04-canonical/run-a/candidate-player-seasons.json data/reports/projection-rookie-year2-v01/run-b.json
          cmp data/reports/projection-rookie-year2-v01/run-a.json data/reports/projection-rookie-year2-v01/run-b.json
          sha256sum data/reports/projection-rookie-year2-v01/run-a.json > data/reports/projection-rookie-year2-v01/result.sha256
      - name: Enforce chronology and production firewalls
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/reports/projection-rookie-year2-v01/run-a.json'))
          assert r['retrospective_observed']==2025
          assert max(r['development_target_seasons'])<2025
          assert r['identity_and_provenance']['source_to_metadata_unmatched']==0
          assert r['identity_and_provenance']['paired_duplicate_identities']==0
          assert r['features']['no_generic_age_multiplier'] is True
          assert r['features']['excluded_point_in_time_unsafe']==['team_change']
          assert r['established_player_regression']['validated_v04_immutable'] is True
          assert r['flags']['production_projection_eligible'] is False
          assert r['flags']['dynasty_value_eligible'] is False
          if r['decision']=='READY FOR QA — HIGH RISK':
              assert any(x['candidate_gate_pass'] for x in r['candidate_gates'].values())
          else:
              assert r['decision']=='MORE ROOKIE→YEAR-2 RESEARCH REQUIRED'
              assert not any(x['candidate_gate_pass'] for x in r['candidate_gates'].values())
          print(r['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: league-vector-rookie-year2-v01
          path: data/reports/projection-rookie-year2-v01/
          if-no-files-found: error
          retention-days: 30
