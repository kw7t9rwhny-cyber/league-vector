name: Stage 3C Temporary Test Materializer
on:
  push:
    branches: [agent/stage3c-transient-authority-recovery-v01]
    paths: ['.github/workflows/stage3c-temp-patch-test.yml']
permissions: {contents: write}
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch historical source-string assertion and create blob
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='tests/development-orchestrator-stage3c-agentic.test.js'
          s=open(p).read(); old='sameActivationClaims.length > 1'; assert s.count(old)==2
          s=s.replace(old,'same.length>1'); open('/tmp/patched','w').write(s)
          PY
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          raw=open('/tmp/patched','rb').read(); payload=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
          for i in range(4):
              p=subprocess.run(['gh','api','--method','POST',f'/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs','--input','-'],input=payload,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode==0: print('TEST_BLOB='+json.loads(p.stdout)['sha']); break
              if i==3: raise SystemExit(p.stderr.decode())
              time.sleep(2**i)
          PY
