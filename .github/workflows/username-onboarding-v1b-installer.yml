name: Apply Username Onboarding V1B

on:
  push:
    branches:
      - codex/username-first-onboarding-v1b
    paths:
      - ".github/workflows/username-onboarding-v1b-installer.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/username-first-onboarding-v1b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Decode exact implementation payload
        run: |
          cat .github/v1b-payload/part-* > /tmp/lv-v1b.b64
          base64 --decode /tmp/lv-v1b.b64 > /tmp/lv-v1b.tar.gz
          echo "cd932dbccdadc77cd830020686e5ef92c42693d3a21c4947f78f0765d4a3b4b7  /tmp/lv-v1b.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/lv-v1b.tar.gz
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/username-onboarding-v1b.spec.js
      - name: Commit verified implementation
        run: |
          rm -rf .github/v1b-payload
          rm -f .github/workflows/username-onboarding-v1b-installer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add username-first Sleeper onboarding V1B"
          git push origin HEAD:codex/username-first-onboarding-v1b
