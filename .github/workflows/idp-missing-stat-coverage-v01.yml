name: IDP Missing-Stat Coverage v0.1
on:
  push:
    branches: [codex/idp-missing-stat-coverage-v01]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated frozen historical snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lv /tmp/unpacked .cache/idp-missing-stat-v01
          curl -L --fail-with-body -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9205731274/zip -o /tmp/lv/control.zip
          unzip -q /tmp/lv/control.zip -d /tmp/unpacked
          cp -R /tmp/unpacked/.cache/lv-v04-canonical/. .cache/idp-missing-stat-v01/
          cp /tmp/unpacked/data/reports/projection-v04-canonical/snapshot-manifest.json .cache/idp-missing-stat-v01/snapshot-manifest.json
      - name: Verify frozen input snapshot
        run: python -c "import json; m=json.load(open('.cache/idp-missing-stat-v01/snapshot-manifest.json')); assert m['snapshot_sha256']=='d261bfb0f64f60f01db7e85cffe36b4025bf5a2958e9ef940968cbd2115c6188'"
      - name: Install pinned research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Run twice and prove deterministic output
        run: |
          mkdir -p data/reports/idp-missing-stat-coverage-v01
          python scripts/idp-missing-stat-coverage-v01.py .cache/idp-missing-stat-v01 data/reports/idp-missing-stat-coverage-v01/run-a.json
          python scripts/idp-missing-stat-coverage-v01.py .cache/idp-missing-stat-v01 data/reports/idp-missing-stat-coverage-v01/run-b.json
          cmp data/reports/idp-missing-stat-coverage-v01/run-a.json data/reports/idp-missing-stat-coverage-v01/run-b.json
          sha256sum data/reports/idp-missing-stat-coverage-v01/run-a.json > data/reports/idp-missing-stat-coverage-v01/result.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: league-vector-idp-missing-stat-coverage-v01
          path: data/reports/idp-missing-stat-coverage-v01/
          retention-days: 30
