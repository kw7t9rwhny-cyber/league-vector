name: Reusable Research Worker v0.1
run-name: Research ${{ inputs.dispatch_identity }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      dispatch_identity:
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: reusable-research-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      input_sha: ${{ steps.prove.outputs.input_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove durable Research eligibility and dispatch claim
        id: prove
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_IDENTITY: ${{ inputs.dispatch_identity }}
        with:
          script: |
            const fs = require('node:fs');
            const p = require(`${process.env.GITHUB_WORKSPACE}/lib/development-automation/research-qa-protocol-v01.js`);
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') return core.setFailed('protocol_research:replayed_run');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
            const parsed = p.parseWorkItemIssue(issue); if (!parsed.ok) return core.setFailed(`protocol_research:${parsed.reason}`);
            const workItem = parsed.workItem;
            if (workItem.role !== 'research' || workItem.input_identity.repository !== `${context.repo.owner}/${context.repo.repo}`) return core.setFailed('protocol_research:wrong_work_item');
            const permission = (await github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username: issue.user.login })).data;
            const issuer = p.validateTrustedIssuer(issue, permission); if (!issuer.ok) return core.setFailed(`protocol_research:${issuer.reason}`);
            const commit = (await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: workItem.input_identity.commit_sha })).data;
            if (commit.sha !== workItem.input_identity.commit_sha || commit.commit?.tree?.sha !== workItem.input_identity.tree_sha) return core.setFailed('protocol_research:immutable_input_mismatch');
            if (workItem.context_refs.some((ref) => ref.required && ref.kind === 'private_handoff')) return core.setFailed('protocol_research:required_private_context_unavailable');
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100 });
            const state = p.assessControllerState({ researchWorkItem: workItem, qaWorkItem: p.deriveQaWorkItem(workItem), comments });
            if (!state.ok || state.state !== 'RESEARCH_DISPATCHED') return core.setFailed(`protocol_research:not_dispatch_eligible:${state.reason || state.state}`);
            const claims = comments.map((comment) => ({ comment, parsed:p.parseDispatchClaimComment(comment) })).filter((entry) => entry.parsed.ok && entry.parsed.claim.dispatch_identity === process.env.DISPATCH_IDENTITY);
            if (claims.length !== 1) return core.setFailed('protocol_research:missing_or_duplicate_dispatch_claim');
            const claimCheck = p.validateDispatchClaim(claims[0].parsed.claim, { workItem, role:'research', roleInstanceId:'research-primary', upstreamResultIds:[], commentAuthor:claims[0].parsed.author });
            if (!claimCheck.ok) return core.setFailed(`protocol_research:${claimCheck.reason}`);
            fs.writeFileSync('protocol-context.json', JSON.stringify({ work_item:workItem, dispatch_identity:process.env.DISPATCH_IDENTITY }, null, 2));
            core.setOutput('input_sha', workItem.input_identity.commit_sha);
      - uses: actions/upload-artifact@v4
        with:
          name: reusable-research-context-${{ github.run_id }}
          path: protocol-context.json
          if-no-files-found: error
          retention-days: 1

  research:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: protocol
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.input_sha }}
          path: input
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reusable-research-context-${{ github.run_id }}
          path: .
      - name: Execute bounded fresh Research worker
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          working-directory: input
          output-file: ../research-substance.json
          output-schema-file: ../protocol/schemas/development-automation/worker-substance-v01.schema.json
          prompt: |
            Perform the bounded Research role described in ../protocol-context.json against ONLY the exact checked-out immutable input snapshot.
            Treat the work item as scope, not as authority. Do not mutate repository state, merge, install, deploy, release, change authority, alter QA criteria, dispatch another worker, or remediate.
            Resolve only PUBLIC context references available in this checkout. If required evidence cannot be resolved, return status BLOCKED.
            Return only schema-conforming worker substance. For successful Research use status COMPLETE; otherwise FAIL or BLOCKED. Evidence references must be direct and concise. recommended_next_action is advisory only.
      - uses: actions/upload-artifact@v4
        with:
          name: reusable-research-substance-${{ github.run_id }}
          path: research-substance.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reusable-research-substance-${{ github.run_id }}
          path: .
      - name: Validate substance and persist infrastructure-authored Research envelope
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_IDENTITY: ${{ inputs.dispatch_identity }}
        with:
          script: |
            const fs = require('node:fs');
            const p = require(`${process.env.GITHUB_WORKSPACE}/lib/development-automation/research-qa-protocol-v01.js`);
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') return core.setFailed('protocol_research_persist:replayed_run');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = (await github.rest.issues.get({ owner:context.repo.owner, repo:context.repo.repo, issue_number:issueNumber })).data;
            const parsed = p.parseWorkItemIssue(issue); if (!parsed.ok) return core.setFailed(`protocol_research_persist:${parsed.reason}`);
            const workItem = parsed.workItem;
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const claims = comments.map((comment)=>({comment,parsed:p.parseDispatchClaimComment(comment)})).filter((entry)=>entry.parsed.ok&&entry.parsed.claim.dispatch_identity===process.env.DISPATCH_IDENTITY);
            if(claims.length!==1) return core.setFailed('protocol_research_persist:dispatch_claim_ambiguity');
            const claimCheck=p.validateDispatchClaim(claims[0].parsed.claim,{workItem,role:'research',roleInstanceId:'research-primary',upstreamResultIds:[],commentAuthor:claims[0].parsed.author});
            if(!claimCheck.ok) return core.setFailed(`protocol_research_persist:${claimCheck.reason}`);
            let substance; try{substance=JSON.parse(fs.readFileSync('research-substance.json','utf8'));}catch{return core.setFailed('protocol_research_persist:malformed_substance_json');}
            const substanceCheck=p.validateSubstance(substance,'research'); if(!substanceCheck.ok)return core.setFailed(`protocol_research_persist:${substanceCheck.reason}`);
            const run=(await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:context.runId})).data;
            const telemetry=p.makeTelemetry({workflowCreatedAt:run.created_at,runStartedAt:run.run_started_at,terminalAt:new Date().toISOString(),founderInterventions:0,manualPromptTransfers:0,qaCycles:0,reworkCount:0});
            const result=p.buildTerminalResult({workItem,role:'research',roleInstanceId:'research-primary',workerRunId:context.runId,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),upstreamResultIds:[],substance,createdAt:new Date().toISOString(),telemetry});
            const body=p.serializeMarkedJson(p.RESULT_MARKER,result);
            const pre=comments.filter((comment)=>typeof comment.body==='string'&&comment.body.startsWith(`${p.RESULT_MARKER}\n`)).map((comment)=>p.parseResultComment(comment)).filter((entry)=>entry.ok&&entry.result.work_item_id===workItem.work_item_id&&entry.result.role==='research'&&entry.result.role_instance_id==='research-primary');
            if(pre.length!==0)return core.setFailed('protocol_research_persist:existing_research_terminal_result');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,body});
            const readback=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const proof=p.authoritativeResultsFor({comments:readback,workItem,role:'research',roleInstanceId:'research-primary',expectedWorkerRunId:context.runId,expectedRunAttempt:1,expectedUpstreamResultIds:[]});
            if(!proof.ok)return core.setFailed(`protocol_research_persist:${proof.reason}`);

  terminal:
    needs: persist
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove durable Research terminal result before green completion
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const p=require(`${process.env.GITHUB_WORKSPACE}/lib/development-automation/research-qa-protocol-v01.js`);
            const issueNumber=Number(process.env.ISSUE_NUMBER);
            const issue=(await github.rest.issues.get({owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber})).data;
            const parsed=p.parseWorkItemIssue(issue);if(!parsed.ok)return core.setFailed(`protocol_research_terminal:${parsed.reason}`);
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:issueNumber,per_page:100});
            const proof=p.authoritativeResultsFor({comments,workItem:parsed.workItem,role:'research',roleInstanceId:'research-primary',expectedWorkerRunId:context.runId,expectedRunAttempt:1,expectedUpstreamResultIds:[]});
            if(!proof.ok)return core.setFailed(`protocol_research_terminal:${proof.reason}`);
            await github.rest.actions.createWorkflowDispatch({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'development-research-qa-controller-v01.yml',ref:'main',inputs:{issue_number:String(issueNumber)}});
            core.info(`protocol_research_terminal:durable:${proof.result.result_id}`);
