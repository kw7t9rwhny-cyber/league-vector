name: Command Center V1A Preview

on:
  pull_request:
    paths:
      - "app.js"
      - "command-center-bridge-v1a.js"
      - "command-center-v1a.js"
      - "command-center-v1a.css"
      - "index.html"
      - "package.json"
      - "tests/command-center-v1a.test.js"
      - "tests/e2e/command-center-v1a.spec.js"
      - ".github/workflows/command-center-preview-v1a.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Assemble exact static review artifact
        run: |
          mkdir -p site-preview/data/experimental
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp {} site-preview/ \;
          cp data/experimental/2026-projections.json site-preview/data/experimental/2026-projections.json
      - name: Verify command center assets and protected analyzer contract
        run: |
          test -s site-preview/index.html
          test -s site-preview/app.js
          test -s site-preview/premium-homepage-truth.css
          test -s site-preview/command-center-v1a.css
          test -s site-preview/command-center-bridge-v1a.js
          test -s site-preview/command-center-v1a.js
          grep -q 'app.js?v=0.8' site-preview/index.html
          grep -q 'command-center-v1a.css?v=0.1' site-preview/index.html
          grep -q 'command-center-bridge-v1a.js?v=0.1' site-preview/index.html
          grep -q 'command-center-v1a.js?v=0.1' site-preview/index.html
          test "$(grep -o 'id="leagueId"' site-preview/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="go"' site-preview/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="status"' site-preview/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="results"' site-preview/index.html | wc -l)" -eq 1
          python3 -m http.server 4175 --directory site-preview >/tmp/league-vector-command-center-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4175/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4175/command-center-v1a.css?v=0.1 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4175/command-center-bridge-v1a.js?v=0.1 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4175/command-center-v1a.js?v=0.1 >/dev/null
      - name: Upload command center review artifact
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-command-center-v1a-preview
          path: site-preview/
          if-no-files-found: error
          retention-days: 14
