name: Projection v0.4 Ridge Research

on:
  pull_request:
    paths:
      - 'scripts/projection-v04-fast.js'
      - '.github/workflows/projection-v04-fast.yml'

permissions:
  contents: read

jobs:
  ridge-first:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run selection-safe weighting and richer Ridge benchmark
        run: node scripts/projection-v04-fast.js data/reports/projection-v04-fast
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v04-fast
          path: data/reports/projection-v04-fast/
          if-no-files-found: error
          retention-days: 14
