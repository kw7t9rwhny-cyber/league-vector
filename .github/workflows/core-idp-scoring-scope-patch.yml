name: Core IDP scoring fixture patch
on:
  push:
    branches: [codex/idp-scoring-founder-hotfix-v01]
    paths: [.github/workflows/core-idp-scoring-scope-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/idp-scoring-founder-hotfix-v01
      - name: Update deterministic IDP scoring fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/idp-current-season-rankings-v01.test.js')
          s=p.read_text()
          replacements={
            "scoring_settings: { tkl_solo:1.5, tkl_ast:0.75, sack:4, int:6, pass_def:1.5, ff:3, fum_rec:3, def_td:6, safe:4, qb_hit:1, tkl_loss:2 }":"scoring_settings: { idp_tkl_solo:1.5, idp_tkl_ast:0.75, idp_sack:4, idp_int:6, idp_pass_def:1.5, idp_ff:3, idp_fum_rec:3, idp_def_td:6, idp_safe:4, idp_qb_hit:1, idp_tkl_loss:2 }",
            "const rules = { ...league().scoring_settings, blk_kick: 6 };":"const rules = { ...league().scoring_settings, idp_blk_kick: 6 };",
            "assert.deepEqual(result.scoring_coverage.unsupported_keys, ['blk_kick']);":"assert.deepEqual(result.scoring_coverage.unsupported_keys, ['idp_blk_kick']);",
            "{ tkl_solo:-1 }":"{ idp_tkl_solo:-1 }",
            "scoring_settings:{tkl_solo:1}":"scoring_settings:{idp_tkl_solo:1}",
            "scoring_settings:{...league().scoring_settings, blk_kick:6}":"scoring_settings:{...league().scoring_settings, idp_blk_kick:6}",
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing fixture pattern: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/idp-current-season-rankings-v01.test.js
          git commit -m 'test: align IDP fixtures with Sleeper player scoring keys'
          git push origin HEAD:codex/idp-scoring-founder-hotfix-v01
