name: Core Founder scoring lifecycle test patch
on:
  push:
    branches: [codex/idp-scoring-founder-hotfix-v01]
    paths: [.github/workflows/core-idp-scoring-scope-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/idp-scoring-founder-hotfix-v01
      - name: Correct lifecycle offense assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/idp-founder-scoring-lifecycle.spec.js')
          s=p.read_text()
          old="""  await mockLifecycle(page, defensibleScoring);\n  const offensiveBefore = await page.locator('#playerValues .lv-value').first().textContent();\n  const contract = await analyze(page);"""
          new="""  await mockLifecycle(page, defensibleScoring);\n  const contract = await analyze(page);\n  const offensiveBefore = await page.locator('#playerValues .lv-value').first().textContent();"""
          if old not in s: raise SystemExit('lifecycle offense pattern not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/idp-founder-scoring-lifecycle.spec.js
          git commit -m 'test: correct Founder scoring lifecycle offense assertion'
          git push origin HEAD:codex/idp-scoring-founder-hotfix-v01
