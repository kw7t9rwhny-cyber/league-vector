name: Reusable Research Completion Reconciler v0.1
on:
  workflow_run:
    workflows: ["Reusable Research Worker v0.1"]
    types: [completed]

permissions: {}

jobs:
  reconcile:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate completed Research wake and re-run deterministic Controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/research-qa-workflow-helper-v01.js reconcile-research-completion "$GITHUB_EVENT_PATH"
