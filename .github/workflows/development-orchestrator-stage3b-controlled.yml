name: Development Orchestrator Stage 3B Controlled Activation

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: "Exactly one canonical positive-integer PR number"
        required: true
        type: string
      mode:
        description: "Dry-run is default. Execute remains blocked until Founder environment protection/source provenance is separately verified."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      replay_fingerprint: ${{ steps.preview.outputs.replay_fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate one exact target PR
        env:
          TARGET_PR: ${{ inputs.target_pr_number }}
        run: |
          node -e 'require("./scripts/development-orchestrator-v03b-controlled.js").parseTargetPr(process.env.TARGET_PR)'
      - name: Build deterministic preview from live GitHub state
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.target_pr_number }}
        run: |
          node scripts/development-orchestrator-v03b-controlled.js preview --target-pr "$TARGET_PR" > /tmp/stage3b-controlled-preview.json
          node - <<'NODE'
          const fs=require('fs');
          const C=require('./scripts/development-orchestrator-v03b-controlled.js');
          const p=JSON.parse(fs.readFileSync('/tmp/stage3b-controlled-preview.json','utf8'));
          const requested=C.parseTargetPr(process.env.TARGET_PR);
          if(p.authorization!==false) process.exit(1);
          if(p.target_pr!==requested) process.exit(1);
          if(!/^[0-9a-f]{64}$/.test(p.replay_fingerprint||'')) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`replay_fingerprint=${p.replay_fingerprint}\n`);
          console.log(JSON.stringify(p,null,2));
          NODE
      - name: Upload non-authorizing preview
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-controlled-preview-pr-${{ inputs.target_pr_number }}
          path: /tmp/stage3b-controlled-preview.json
          retention-days: 7

  dry-run-proof:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Confirm dry-run has no write scope
        run: |
          echo "Preview completed. No issues:write permission exists in this job."
          echo "No mutation attempted."

  execute-one-pr:
    if: ${{ inputs.mode == 'execute' }}
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Fail closed before any write-capable command
        env:
          TARGET_PR: ${{ inputs.target_pr_number }}
          EXPECTED_FINGERPRINT: ${{ needs.preview.outputs.replay_fingerprint }}
        run: |
          cat > /tmp/stage3b-controlled-audit.json <<EOF
          {
            "schema": "lv-stage3b-controlled-live-block-v0.1",
            "target_pr_input": "${TARGET_PR}",
            "expected_preview_fingerprint": "${EXPECTED_FINGERPRINT}",
            "abort_reason": "founder_environment_source_provenance_unverifiable",
            "live_activation_blocked": true,
            "manual_review_required": false
          }
          EOF
          cat /tmp/stage3b-controlled-audit.json
          echo "LIVE ACTIVATION BLOCKED — FOUNDER ENVIRONMENT PROTECTION NOT VERIFIED" >&2
          exit 2
      - name: Upload blocked execution audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-controlled-blocked-pr-${{ inputs.target_pr_number }}
          path: /tmp/stage3b-controlled-audit.json
          if-no-files-found: warn
          retention-days: 30

# SECURITY CONTRACT
# - manual workflow_dispatch only; no schedule, push, pull_request, pull_request_target, comment, or merge trigger
# - exactly one canonical positive-integer target_pr_number; no trimming/normalization, all/*/queue/list/range/fan-out
# - preview is read-only and explicitly non-authorizing
# - live execute is deliberately fail-closed because GitHub Actions exposes no unambiguous runtime provenance proving
#   that a same-name secret came from this exact protected Environment rather than repository/organization secret scope
# - stage3b-controlled-activation is intentionally NOT referenced by a runnable environment: job while it does not exist,
#   because GitHub can auto-create a referenced missing environment without protection rules or secrets
# - no vars.* or secrets.* value is accepted as Founder source authentication in this candidate
# - execute permission ceiling remains contents:read, pull-requests:read, issues:write; no broader scope
# - real adapter remains implemented/tested but this workflow never invokes it in execute mode until a separately
#   authorized mechanism can authenticate Founder Environment provenance
# - only canonical Stage-1 status:* and owner:* label ADD/REMOVE operations exist in the adapter
# - no comments, assignments, body/title edits, issue/PR/branch creation, pushes, merges, reviews, deployments,
#   Founder decisions, QA verdicts, model promotion, external calls, Stage 3C, or cascades
