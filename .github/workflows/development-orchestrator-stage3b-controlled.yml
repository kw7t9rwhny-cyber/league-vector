name: Development Orchestrator Stage 3B Controlled Activation

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: "Exactly one canonical positive-integer PR number"
        required: true
        type: string
      mode:
        description: "Dry-run is default. Execute requires the protected Founder environment and all technical gates."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      replay_fingerprint: ${{ steps.preview.outputs.replay_fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate one exact target PR
        env:
          TARGET_PR: ${{ inputs.target_pr_number }}
        run: |
          node -e 'require("./scripts/development-orchestrator-v03b-controlled.js").parseTargetPr(process.env.TARGET_PR)'
      - name: Build deterministic preview from live GitHub state
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.target_pr_number }}
        run: |
          node scripts/development-orchestrator-v03b-controlled.js preview --target-pr "$TARGET_PR" > /tmp/stage3b-controlled-preview.json
          node - <<'NODE'
          const fs=require('fs');
          const C=require('./scripts/development-orchestrator-v03b-controlled.js');
          const p=JSON.parse(fs.readFileSync('/tmp/stage3b-controlled-preview.json','utf8'));
          const requested=C.parseTargetPr(process.env.TARGET_PR);
          if(p.authorization!==false) process.exit(1);
          if(p.target_pr!==requested) process.exit(1);
          if(!/^[0-9a-f]{64}$/.test(p.replay_fingerprint||'')) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`replay_fingerprint=${p.replay_fingerprint}\n`);
          console.log(JSON.stringify(p,null,2));
          NODE
      - name: Upload non-authorizing preview
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-controlled-preview-pr-${{ inputs.target_pr_number }}
          path: /tmp/stage3b-controlled-preview.json
          retention-days: 7

  dry-run-proof:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Confirm dry-run has no write scope
        run: |
          echo "Preview completed. No issues:write permission exists in this job."
          echo "No mutation attempted."

  execute-one-pr:
    if: ${{ inputs.mode == 'execute' }}
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: stage3b-controlled-activation
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute one Founder-approved, fully revalidated label transaction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.target_pr_number }}
          EXPECTED_FINGERPRINT: ${{ needs.preview.outputs.replay_fingerprint }}
          LEAGUE_VECTOR_ORCHESTRATOR_EXECUTE: "1"
          LEAGUE_VECTOR_STAGE3B_ACTIVATED: "1"
          LEAGUE_VECTOR_STAGE3B_ENVIRONMENT_NAME: stage3b-controlled-activation
        run: |
          node scripts/development-orchestrator-v03b-protected.js execute \
            --target-pr "$TARGET_PR" \
            --expected-fingerprint "$EXPECTED_FINGERPRINT" \
            > /tmp/stage3b-protected-audit.json
      - name: Upload protected execution audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-protected-audit-pr-${{ inputs.target_pr_number }}
          path: /tmp/stage3b-protected-audit.json
          if-no-files-found: warn
          retention-days: 30

# SECURITY CONTRACT
# - manual workflow_dispatch only; no schedule, push, pull_request, pull_request_target, comment, workflow_run, or merge trigger
# - exactly one canonical positive-integer target_pr_number; no trimming/normalization, all/*/queue/list/range/fan-out
# - preview is read-only and explicitly non-authorizing; dry-run is the default
# - execute is bound to the exact stage3b-controlled-activation GitHub Environment
# - GitHub Environment protection, including the Founder required-reviewer gate, must pass before the execute job is sent to a runner
# - the admitted environment-bound job itself is the Founder authorization for this one workflow run; no secret value is authoritative
# - repository/org/environment secrets and vars are not read as Founder authority and cannot satisfy the Founder gate
# - live environment metadata is re-read before the controlled executor and must prove required Founder reviewer,
#   prevent_self_review=false, admin bypass disabled, and exactly one allowed deployment branch: main
# - exact workflow/ref/repository/default-branch/fork, preview fingerprint and full Stage-2/3A/3B revalidation remain mandatory
# - execute permission ceiling is contents:read, pull-requests:read, issues:write; preview remains issues:read
# - only canonical Stage-1 status:* and owner:* label ADD/REMOVE operations exist in the adapter
# - no comments, assignments, body/title edits, issue/PR/branch creation, pushes, merges, reviews, deployments,
#   Founder work-item decisions, QA verdicts, model promotion, external calls, Stage 3C, queue-wide execution, or cascades
