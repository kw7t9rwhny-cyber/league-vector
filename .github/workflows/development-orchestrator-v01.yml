name: Development Orchestrator Stage 1+2+3A+3B

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 1 syntax check
        run: node --check scripts/development-orchestrator-v01.js
      - name: Stage 1 deterministic orchestrator tests
        run: node --test tests/development-orchestrator-v01.test.js
      - name: Stage 2 syntax check
        run: node --check scripts/development-orchestrator-v02.js
      - name: Stage 2 deterministic queue/adversarial tests
        run: node --test tests/development-orchestrator-v02.test.js
      - name: Stage 3A syntax check
        run: node --check scripts/development-orchestrator-v03a.js
      - name: Stage 3A deterministic dry-run/adversarial tests
        run: node --test tests/development-orchestrator-v03a.test.js
      - name: Stage 3B syntax check
        run: node --check scripts/development-orchestrator-v03b.js
      - name: Stage 3B deterministic guarded-executor/adversarial tests
        run: node --test tests/development-orchestrator-v03b.test.js
      - name: Stage 3B controlled activation syntax check
        run: node --check scripts/development-orchestrator-v03b-controlled.js
      - name: Stage 3B controlled activation adversarial tests
        run: node --test tests/development-orchestrator-v03b-controlled.test.js
      - name: Stage 3B protected environment activation syntax check
        run: node --check scripts/development-orchestrator-v03b-protected.js
      - name: Stage 3B protected environment activation adversarial tests
        run: node --test tests/development-orchestrator-v03b-protected.test.js
      - name: Validate Stage 1 schema is readable
        run: node scripts/development-orchestrator-v01.js
      - name: Prove Stage 3B Actions execution remains disabled in validation workflow
        env:
          LEAGUE_VECTOR_ORCHESTRATOR_EXECUTE: "0"
          LEAGUE_VECTOR_STAGE3B_ACTIVATED: "0"
          GITHUB_EVENT_NAME_FOR_TEST: ${{ github.event_name }}
          GITHUB_REF_FOR_TEST: ${{ github.ref }}
          GITHUB_REF_TYPE_FOR_TEST: ${{ github.ref_type }}
          GITHUB_REF_NAME_FOR_TEST: ${{ github.ref_name }}
          GITHUB_DEFAULT_BRANCH_FOR_TEST: ${{ github.event.repository.default_branch }}
        run: |
          node - <<'NODE'
          const s=require('./scripts/development-orchestrator-v03b.js');
          const env={
            LEAGUE_VECTOR_ORCHESTRATOR_EXECUTE: process.env.LEAGUE_VECTOR_ORCHESTRATOR_EXECUTE,
            LEAGUE_VECTOR_STAGE3B_ACTIVATED: process.env.LEAGUE_VECTOR_STAGE3B_ACTIVATED,
            GITHUB_EVENT_NAME: process.env.GITHUB_EVENT_NAME_FOR_TEST,
            GITHUB_REF: process.env.GITHUB_REF_FOR_TEST,
            GITHUB_REF_TYPE: process.env.GITHUB_REF_TYPE_FOR_TEST,
            GITHUB_REF_NAME: process.env.GITHUB_REF_NAME_FOR_TEST,
            GITHUB_DEFAULT_BRANCH: process.env.GITHUB_DEFAULT_BRANCH_FOR_TEST,
            GITHUB_HEAD_REPO_FORK: 'false'
          };
          const gate=s.executionGate(env);
          if(gate.allowed) process.exit(1);
          console.log(JSON.stringify(gate));
          NODE
      - name: Dogfood Stage 2 against live GitHub state (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/development-orchestrator-v02.js status --json > /tmp/orchestrator-stage2-status.json
          node scripts/development-orchestrator-v02.js queue qa --json > /tmp/orchestrator-stage2-qa.json
          node scripts/development-orchestrator-v02.js queue core --json > /tmp/orchestrator-stage2-core.json
          node scripts/development-orchestrator-v02.js queue remediation --json > /tmp/orchestrator-stage2-remediation.json
          node scripts/development-orchestrator-v02.js queue founder --json > /tmp/orchestrator-stage2-founder.json
          node scripts/development-orchestrator-v02.js queue research --json > /tmp/orchestrator-stage2-research.json
          node -e 'const s=require("/tmp/orchestrator-stage2-status.json"); if(s.source!=="live-github-read-only") process.exit(1); console.log(JSON.stringify(s.counts));'
      - name: Dogfood Stage 3A planner against live GitHub state (zero mutations)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/development-orchestrator-v03a.js plan --json > /tmp/orchestrator-stage3a-plan.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/orchestrator-stage3a-plan.json', 'utf8'));
          if (p.mutation_mode !== 'dry-run-read-only') process.exit(1);
          if (p.command_center_preview.operational !== false) process.exit(1);
          if (p.command_center_preview.mutation_mode !== 'dry-run-read-only') process.exit(1);
          const text = JSON.stringify(p);
          if (text.includes('QA PASS — tested head') || text.includes('QA FAIL — tested head')) process.exit(1);
          console.log(JSON.stringify(p.counts));
          NODE
      - name: Stage 3B live safety dogfood — no write adapter, no execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LEAGUE_VECTOR_ORCHESTRATOR_EXECUTE: "0"
          LEAGUE_VECTOR_STAGE3B_ACTIVATED: "0"
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/orchestrator-stage3a-plan.json","utf8")); const plans=p.plans||[]; if(plans.length) fs.writeFileSync("/tmp/stage3b-plan.json",JSON.stringify(plans[0])); else console.log("no structured live plan to dry-run through executor");'
          if [ -f /tmp/stage3b-plan.json ]; then
            node scripts/development-orchestrator-v03b.js --plan /tmp/stage3b-plan.json --json > /tmp/orchestrator-stage3b-audit.json
            node -e 'const a=require("/tmp/orchestrator-stage3b-audit.json"); if(a.mode!=="dry-run"||a.mutations_attempted.length||a.mutations_completed.length) process.exit(1); console.log(JSON.stringify({pr:a.pr,result:a.post_write_verification,abort:a.aborted_reason}));'
          fi
      - name: Upload Stage 3A/3B dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: development-orchestrator-stage3a-stage3b-preview
          path: |
            /tmp/orchestrator-stage3a-plan.json
            /tmp/orchestrator-stage3b-audit.json
          if-no-files-found: warn
          retention-days: 7

  pr-metadata-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on contradictory orchestrator labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          labels = set(json.loads(os.environ['LABELS']))
          statuses = sorted(x for x in labels if x.startswith('status:'))
          owners = sorted(x for x in labels if x.startswith('owner:'))
          risks = sorted(x for x in labels if x.startswith('risk:'))
          errors = []
          if len(statuses) > 1: errors.append(f"multiple status labels: {statuses}")
          if len(owners) > 1: errors.append(f"multiple owner labels: {owners}")
          if len(risks) > 1: errors.append(f"multiple risk labels: {risks}")
          if errors:
              print("; ".join(errors))
              sys.exit(1)
          print("orchestrator metadata is non-contradictory")
          PY

# Security contract: this validation workflow remains read-only.
# Controlled/protected activation is tested only with deterministic/mock inputs here and receives no write token scope.
# No pull_request_target. No live label mutation, assignments, comments, branches, PRs, merges, deployments,
# Founder decisions, paid-service calls, business/legal actions, production-model promotion, Prospective Archive writes,
# or football/product changes are performed here.
