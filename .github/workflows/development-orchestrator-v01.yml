name: Development Orchestrator Stage 1+2+3A

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 1 syntax check
        run: node --check scripts/development-orchestrator-v01.js
      - name: Stage 1 deterministic orchestrator tests
        run: node --test tests/development-orchestrator-v01.test.js
      - name: Stage 2 syntax check
        run: node --check scripts/development-orchestrator-v02.js
      - name: Stage 2 deterministic queue/adversarial tests
        run: node --test tests/development-orchestrator-v02.test.js
      - name: Stage 3A syntax check
        run: node --check scripts/development-orchestrator-v03a.js
      - name: Stage 3A deterministic dry-run/adversarial tests
        run: node --test tests/development-orchestrator-v03a.test.js
      - name: Validate Stage 1 schema is readable
        run: node scripts/development-orchestrator-v01.js
      - name: Dogfood Stage 2 against live GitHub state (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/development-orchestrator-v02.js status --json > /tmp/orchestrator-stage2-status.json
          node scripts/development-orchestrator-v02.js queue qa --json > /tmp/orchestrator-stage2-qa.json
          node scripts/development-orchestrator-v02.js queue core --json > /tmp/orchestrator-stage2-core.json
          node scripts/development-orchestrator-v02.js queue remediation --json > /tmp/orchestrator-stage2-remediation.json
          node scripts/development-orchestrator-v02.js queue founder --json > /tmp/orchestrator-stage2-founder.json
          node scripts/development-orchestrator-v02.js queue research --json > /tmp/orchestrator-stage2-research.json
          node -e 'const s=require("/tmp/orchestrator-stage2-status.json"); if(s.source!=="live-github-read-only") process.exit(1); console.log(JSON.stringify(s.counts));'
      - name: Dogfood Stage 3A planner against live GitHub state (zero mutations)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/development-orchestrator-v03a.js plan --json > /tmp/orchestrator-stage3a-plan.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/orchestrator-stage3a-plan.json', 'utf8'));
          if (p.mutation_mode !== 'dry-run-read-only') process.exit(1);
          if (p.command_center_preview.operational !== false) process.exit(1);
          if (p.command_center_preview.mutation_mode !== 'dry-run-read-only') process.exit(1);
          const text = JSON.stringify(p);
          if (text.includes('QA PASS — tested head') || text.includes('QA FAIL — tested head')) process.exit(1);
          console.log(JSON.stringify(p.counts));
          NODE
      - name: Upload Stage 3A Command Center dry-run preview
        uses: actions/upload-artifact@v4
        with:
          name: development-orchestrator-stage3a-preview
          path: /tmp/orchestrator-stage3a-plan.json
          if-no-files-found: error
          retention-days: 7

  pr-metadata-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on contradictory orchestrator labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          labels = set(json.loads(os.environ['LABELS']))
          statuses = sorted(x for x in labels if x.startswith('status:'))
          owners = sorted(x for x in labels if x.startswith('owner:'))
          risks = sorted(x for x in labels if x.startswith('risk:'))
          errors = []
          if len(statuses) > 1: errors.append(f"multiple status labels: {statuses}")
          if len(owners) > 1: errors.append(f"multiple owner labels: {owners}")
          if len(risks) > 1: errors.append(f"multiple risk labels: {risks}")
          if errors:
              print("; ".join(errors))
              sys.exit(1)
          print("orchestrator metadata is non-contradictory")
          PY

# Security contract: Stage 1, Stage 2, and Stage 3A are intentionally read-only.
# Stage 3A produces mutation PLANS and workflow artifacts only; it has no GitHub write client.
# No pull_request_target. No privileged untrusted execution. No labels, assignments,
# comments, branches, PRs, merges, deployments, Founder decisions, paid-service calls,
# business/legal actions, or production-model promotion are mutated by this workflow.
