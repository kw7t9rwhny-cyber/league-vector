name: Projection v0.4 Model Family Research

on:
  pull_request:
    paths:
      - 'scripts/projection-v04-family2.js'
      - '.github/workflows/projection-v04-family2.yml'

permissions:
  contents: read

jobs:
  model-family:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run target-specific Ridge Elastic availability and ensemble benchmark
        run: node scripts/projection-v04-family2.js data/reports/projection-v04-family2
      - name: Upload model-family results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v04-family2
          path: data/reports/projection-v04-family2/
          if-no-files-found: error
          retention-days: 14
