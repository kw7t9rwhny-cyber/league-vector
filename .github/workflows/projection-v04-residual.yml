name: Projection v0.4 Residual Research

on:
  pull_request:
    paths:
      - 'scripts/projection-v04-residual-audit.js'
      - '.github/workflows/projection-v04-residual.yml'

permissions:
  contents: read

jobs:
  residual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run baseline offensive residual audit
        run: node scripts/projection-v04-residual-audit.js data/reports/projection-v04-residual-audit
      - name: Upload residual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-vector-projection-v04-residual-audit
          path: data/reports/projection-v04-residual-audit/
          if-no-files-found: error
          retention-days: 14
